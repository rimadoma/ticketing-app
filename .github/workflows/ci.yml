name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**/*.md'
      - 'skaffold.yaml'
      - '**/.dockerignore'
      - '**/.gitignore'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, orders, tickets]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Test
        run: npm test
        working-directory: ${{ matrix.service }}
