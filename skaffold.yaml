apiVersion: skaffold/v4beta14
kind: Config
manifests:
  rawYaml:
    - ./infra/k8s/*
# Default local build & deploy    
build:
  local:
    push: false
  artifacts:
    - image: richdgo4/auth
      context: .
      docker:
        dockerfile: auth/Dockerfile
      sync:
        manual:
          - src: "auth/src/**/*.ts"
            dest: "."
    - image: richdgo4/client
      context: .
      docker:
        dockerfile: client/Dockerfile
      sync:
        manual:
          - src: "client/pages/**/*.js"
            dest: "."
    - image: richdgo4/tickets
      context: .
      docker:
        dockerfile: tickets/Dockerfile
      sync:
        manual:
          - src: "tickets/src/**/*.ts"
            dest: "."
    - image: richdgo4/orders
      context: .
      docker:
        dockerfile: orders/Dockerfile
      sync:
        manual:
          - src: "orders/src/**/*.ts"
            dest: "."
    - image: richdgo4/expiration
      context: .
      docker:
        dockerfile: expiration/Dockerfile
      sync:
        manual:
          - src: "expiration/src/**/*.ts"
            dest: "."
    - image: richdgo4/payments
      context: .
      docker:
        dockerfile: payments/Dockerfile
      sync:
        manual:
          - src: "payments/src/**/*.ts"
            dest: "."

# Expose ports for easier local testing
portForward:
  - resourceType: service
    resourceName: auth-mongo-service
    namespace: default
    port: 27017
    localPort: 27017
  - resourceType: service
    resourceName: tickets-mongo-service
    namespace: default
    port: 27017
    localPort: 27018
  - resourceType: service
    resourceName: orders-mongo-service
    namespace: default
    port: 27017
    localPort: 27019
  - resourceType: service
    resourceName: payments-mongo-service
    namespace: default
    port: 27017
    localPort: 27020
    # AMQP
  - resourceType: service
    resourceName: rabbitmq-service
    namespace: default
    port: 5672
    localPort: 5672
    # Management UI
  - resourceType: service
    resourceName: rabbitmq-service
    namespace: default
    port: 15672
    localPort: 15672

profiles:
  # Deploy to GCP
  - name: gcp
    manifests:
      rawYaml:
        - ./infra/k8s-gcp/*
    build:
      local:
        push: true
      artifacts:
        - image: europe-north1-docker.pkg.dev/project-809e066d-e5ea-4d42-aa1/ticketing/auth
          context: .
          docker:
            dockerfile: auth/Dockerfile
        - image: europe-north1-docker.pkg.dev/project-809e066d-e5ea-4d42-aa1/ticketing/client
          context: .
          docker:
            dockerfile: client/Dockerfile.prod
        - image: europe-north1-docker.pkg.dev/project-809e066d-e5ea-4d42-aa1/ticketing/tickets
          context: .
          docker:
            dockerfile: tickets/Dockerfile
        - image: europe-north1-docker.pkg.dev/project-809e066d-e5ea-4d42-aa1/ticketing/orders
          context: .
          docker:
            dockerfile: orders/Dockerfile
        - image: europe-north1-docker.pkg.dev/project-809e066d-e5ea-4d42-aa1/ticketing/expiration
          context: .
          docker:
            dockerfile: expiration/Dockerfile
        - image: europe-north1-docker.pkg.dev/project-809e066d-e5ea-4d42-aa1/ticketing/hedgehog-consultancy
          context: hedgehog-consultancy
          docker:
            dockerfile: Dockerfile