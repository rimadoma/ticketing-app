apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-service
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/hedgehog/consult
        pathType: ImplementationSpecific
        backend:
          service:
            name: hedgehog-consultancy-service
            port:
              number: 3001
