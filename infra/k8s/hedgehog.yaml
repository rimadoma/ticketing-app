apiVersion: apps/v1
kind: Deployment
metadata:
  name: hedgehog-consultancy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hedgehog-consultancy
  template:
    metadata:
      labels:
        app: hedgehog-consultancy
    spec:
      containers:
        - name: hedgehog-consultancy
          image: richdgo4/hedgehog-consultancy:latest
---
apiVersion: v1
kind: Service
metadata:
  name: hedgehog-consultancy-service
spec:
  type: ClusterIP
  selector:
    app: hedgehog-consultancy
  ports:
    - name: hedgehog-consultancy
      protocol: TCP
      port: 3001
      targetPort: 3001
