# NB doesn't have PVC yet!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-mongo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-mongo
  template:
    metadata:
      labels:
        app: payments-mongo
    spec:
      containers:
        - name: payments-mongo
          image: mongo:8
---
apiVersion: batch/v1
kind: Job
metadata:
  name: payments-mongo-index
spec:
  ttlSecondsAfterFinished: 30
  template:
    spec:
      containers:
        - name: create-index
          image: mongo:8
          command:
            - mongosh
            - mongodb://payments-mongo-service:27017/payments
            - --eval
            - "db.payments.createIndex({ orderId: 1 })"
      restartPolicy: OnFailure
---
apiVersion: v1
kind: Service
metadata:
  name: payments-mongo-service
spec:
  type: ClusterIP
  selector:
    app: payments-mongo
  ports:
    - name: db
      protocol: TCP
      port: 27017
      targetPort: 27017
