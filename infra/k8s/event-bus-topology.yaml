apiVersion: v1
kind: ConfigMap
metadata:
  name: event-bus-topology
data:
  # Full queue topology, injected into every event-bus service via envFrom.
  # Format: ;-separated `service,exchange,suffix` rows.
  #   route = "<exchange>.<suffix>"           e.g. order.created
  #   queue = "<service>.<exchange>.<suffix>" e.g. expiration.order.created
  # Every connecting service asserts this whole topology (idempotently) at
  # startup, so queues exist and are bound before any producer publishes.
  EVENT_BUS_TOPOLOGY: >-
    orders,ticket,created;
    orders,ticket,updated;
    orders,payment,created;
    orders,expiration,complete;
    tickets,order,created;
    tickets,order,cancelled;
    payments,order,created;
    payments,order,cancelled;
    expiration,order,created
