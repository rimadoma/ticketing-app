apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expiration
  template:
    metadata:
      labels:
        app: expiration
    spec:
      containers:
        - name: expiration
          image: richdgo4/expiration:latest
          env:
            - name: REDIS_URL
              value: "redis://expiration-redis-service:6379"
